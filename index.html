
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#120006">
<title>For My Cute Friend Sabeen 💗</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    background: radial-gradient(circle at top, #5c0927 0%, #25000e 35%, #090005 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px 0;
}

.glow {
    position: fixed;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: rgba(255, 20, 90, 0.12);
    filter: blur(80px);
    pointer-events: none;
}

.glow.one {
    top: -180px;
    left: -150px;
}

.glow.two {
    bottom: -180px;
    right: -150px;
}

.container {
    width: 92%;
    max-width: 550px;
    min-height: 560px;
    padding: 45px 25px;
    border-radius: 30px;
    background: rgba(255, 255, 255, 0.055);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 25px 80px rgba(0,0,0,.55),
                inset 0 1px 0 rgba(255,255,255,.08);
    text-align: center;
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.friend-title {
    font-size: 20px;
    font-weight: 700;
    color: #ffd7e2;
    text-shadow: 0 0 10px rgba(255,50,100,.6);
    margin-bottom: 25px;
    animation: fadeDown 1.5s ease;
}

h1 {
    font-size: clamp(35px, 8vw, 50px);
    margin-bottom: 12px;
    background: linear-gradient(90deg, #fff, #ff9fb7, #fff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: fadeIn 1.5s ease;
}

.subtitle {
    color: rgba(255,255,255,.72);
    font-size: 16px;
    margin-bottom: 35px;
    line-height: 1.6;
    animation: fadeIn 2s ease;
}

#loveText {
    width: 100%;
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(24px, 6vw, 34px);
    font-weight: 700;
    color: #ffb2c4;
    text-shadow: 0 0 10px rgba(255,23,79,.8),
                 0 0 30px rgba(255,23,79,.4);
    margin-bottom: 10px;
    overflow-wrap: anywhere;
}

.love-animation {
    animation: lovePop .6s ease;
}

#heartBtn {
    border: none;
    outline: none;
    padding: 16px 30px;
    border-radius: 100px;
    font-size: 17px;
    font-weight: bold;
    color: white;
    background: linear-gradient(135deg, #ff174f, #d90045);
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(255,23,79,.35);
    transition: .25s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

#heartBtn:hover {
    transform: translateY(-3px) scale(1.04);
    box-shadow: 0 12px 35px rgba(255,23,79,.5);
}

#heartBtn:active {
    transform: scale(.94);
}

#counter {
    margin-top: 18px;
    color: rgba(255,255,255,.5);
    font-size: 13px;
    min-height: 18px;
}

.heart {
    position: fixed;
    bottom: -40px;
    color: #ff174f;
    pointer-events: none;
    z-index: 1;
    animation: floatUp linear forwards;
    filter: drop-shadow(0 0 8px rgba(255,23,79,.8));
}

.star {
    position: fixed;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: white;
    opacity: .5;
    animation: twinkle 2s infinite alternate;
    z-index: 0;
    pointer-events: none;
}

.final-message {
    font-size: clamp(19px, 5vw, 25px);
    line-height: 1.7;
    color: #ffd1dc;
    text-shadow: 0 0 15px rgba(255,23,79,.5);
}

.final-message .big-heart {
    display: block;
    font-size: 65px;
    margin-bottom: 15px;
    animation: heartbeat 1.2s infinite;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes lovePop {
    0% { opacity: 0; transform: scale(.4); }
    60% { opacity: 1; transform: scale(1.12); }
    100% { opacity: 1; transform: scale(1); }
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.18); }
}

@keyframes floatUp {
    0% {
        transform: translateY(0) rotate(0deg) scale(.7);
        opacity: 0;
    }
    10% { opacity: 1; }
    100% {
        transform: translateY(-115vh) rotate(360deg) scale(1.2);
        opacity: 0;
    }
}

@keyframes twinkle {
    from { opacity: .15; transform: scale(.5); }
    to { opacity: .9; transform: scale(1.5); }
}

@media (max-width: 500px) {
    .container {
        min-height: 540px;
        padding: 35px 20px;
        border-radius: 25px;
    }
    .friend-title { font-size: 17px; }
    .subtitle { font-size: 15px; }
    #heartBtn {
        padding: 15px 27px;
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="glow one"></div>
<div class="glow two"></div>

<div class="container">

    <div class="friend-title">
        💗 My Cute & Pagal Friend Sabeen 😂
    </div>

    <h1>Welcome Sabeen Jeee ❤️</h1>

    <p class="subtitle">
        Ek choti si surprise website sirf apke liye...
        <br>
        Ab zyada khush mat hona madam 😂💕
    </p>

    <div id="loveText"></div>

    <button id="heartBtn">
        Click Karo Madam Ji 😂💗
    </button>

    <div id="counter"></div>

</div>

<script>

// 100 CUTE & FUNNY NICKNAMES

const names = [
    "Sabeen Jee",
    "Sabeen Madam",
    "Cutie Sabeen",
    "Pagal Sabeen",
    "Miss Sabeen",
    "Madam Jee",
    "Cutie Pie",
    "Princess",
    "Drama Queen",
    "Miss Attitude",

    "Pagli",
    "Guriya",
    "Choti Bachi",
    "Sweetheart",
    "Miss Cute",
    "Nakhre Wali",
    "Haseena",
    "Miss Sunshine",
    "Beautiful Soul",
    "My Cute Friend",

    "Gulabo",
    "Pari",
    "Doll",
    "Sweetu",
    "Chand",
    "Chandni",
    "Miss Smile",
    "Smile Queen",
    "Miss Pretty",
    "Pretty Girl",

    "Miss Nakhray",
    "Nakhrebaaz",
    "Madam Attitude",
    "Miss Drama",
    "Drama Company",
    "Miss Overthinking",
    "Overthinking Queen",
    "Miss Busy",
    "Busy Bee",
    "Miss Late Reply",

    "Reply Queen",
    "Miss Gussa",
    "Gusse Wali",
    "Cute Angry Bird",
    "Miss Ziddi",
    "Ziddi Bachi",
    "Miss Shaitaan",
    "Shaitaan Pari",
    "Little Trouble",
    "Troublemaker",

    "Sunshine",
    "Moonlight",
    "Angel",
    "Pretty Angel",
    "Sweet Angel",
    "Miss Gorgeous",
    "Lovely Girl",
    "Sweet Girl",
    "My Favorite Human",
    "Special Person",

    "Miss Hansi",
    "Hasti Muskurati",
    "Laughing Queen",
    "Miss Funny",
    "Funny Bunny",
    "Bunny",
    "Teddy Bear",
    "Cute Panda",
    "Little Penguin",
    "Miss Butterfly",

    "Butterfly",
    "Rose",
    "Pink Rose",
    "Little Star",
    "Sparkle Queen",
    "Miss Sparkle",
    "Miss Magic",
    "Magic Girl",
    "My Happiness",
    "My Favorite Smile",

    "Miss Chocolate",
    "Chocolate Girl",
    "Candy",
    "Cupcake",
    "Muffin",
    "Cookie",
    "Honey Bee",
    "Sweet Candy",
    "Miss Ice Cream",
    "Cute Potato",

    "Miss Bak Bak",
    "Bak Bak Queen",
    "Miss Nautanki",
    "Nautanki Queen",
    "Miss Impossible",
    "Miss Unique",
    "One Piece",
    "My Favorite Pagal",
    "Meri Pyari Dost",
    "Sabeen The Cutest"
];

let current = 0;

const loveText = document.getElementById("loveText");
const button = document.getElementById("heartBtn");
const counter = document.getElementById("counter");

button.addEventListener("click", function () {

    if (current < names.length) {

        loveText.classList.remove("love-animation");
        void loveText.offsetWidth;
        loveText.classList.add("love-animation");

        loveText.textContent =
            `I love u ${names[current]} ❤️😂`;

        counter.innerText =
            `${current + 1} / ${names.length}`;

        current++;

        createHearts(6);

        if (current === names.length) {
            button.innerHTML = "One Last Surprise 💌";
        }

    } else {

        loveText.classList.remove("love-animation");

        loveText.innerHTML = `
            <div class="final-message">
                <span class="big-heart">💗</span>

                Sabeen Jee... 🥹💕

                <br><br>

                100 names toh bas bahana tha,
                asal mein apko smile karwana tha. 😂

                <br><br>

                Ap cute bhi ho, thori pagal bhi,
                aur kabhi kabhi bohat zyada
                nakhre wali bhi! 🙄😂

                <br><br>

                Lekin ek baat hai...

                <br><br>

                <b>
                    Ap jaisi dost har kisi ko
                    nahi milti. ❤️
                </b>

                <br><br>

                Apki smile bohat pyari hai,
                isliye hamesha muskuraya karo.

                <br><br>

                Aur haan madam...

                <b>
                    Itna special feel mat karna,
                    website banana meri majboori thi! 😂💗
                </b>

                <br><br>

                Stay Happy, Stay Cute,
                Stay My Favorite Pagal! 🥹💕
            </div>
        `;

        counter.innerText = "∞ 💗 ∞";
        button.style.display = "none";

        createHearts(40);
    }
});

// FLOATING HEARTS

function createHearts(amount = 5) {

    for (let i = 0; i < amount; i++) {

        const heart = document.createElement("div");
        heart.className = "heart";

        heart.textContent =
            Math.random() > .25 ? "❤️" : "💕";

        heart.style.left = Math.random() * 100 + "vw";

        heart.style.fontSize =
            (15 + Math.random() * 25) + "px";

        heart.style.animationDuration =
            (3 + Math.random() * 4) + "s";

        heart.style.animationDelay =
            (Math.random() * .7) + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 8000);
    }
}

// BACKGROUND STARS

function createStars() {

    for (let i = 0; i < 70; i++) {

        const star = document.createElement("div");
        star.className = "star";

        star.style.left =
            Math.random() * 100 + "vw";

        star.style.top =
            Math.random() * 100 + "vh";

        star.style.animationDelay =
            Math.random() * 2 + "s";

        document.body.appendChild(star);
    }
}

createStars();

setTimeout(() => {
    createHearts(8);
}, 1000);

</script>
</body>
</html>
